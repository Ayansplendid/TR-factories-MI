<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --steel: #1C1F22;
    --concrete: #F5F3EE;
    --amber: #D98E2B;
    --teal: #3E5C6B;
    --grey: #8A8F94;
    --line: #D9D4C8;
    --dark-blue: #0a1628;
    --violet: #1a0f3d;
    --neon-blue: #00D9FF;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--dark-blue);
    color: #e0e0ff;
    overflow: hidden;
  }
  #map{ height:100vh; width:100vw; transition: width 0.3s ease; }
  #map.sidebar-open{ width: calc(100vw - 350px); }

  /* ============================================================
     SIDEBAR STYLES
     ============================================================ */
  #sidebar{
    position: fixed;
    right: -350px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: linear-gradient(135deg, #0a1628 0%, #1a0f3d 100%);
    border-left: 3px solid #DA70D6;
    color: #e0e0ff;
    overflow-y: auto;
    z-index: 2000;
    transition: right 0.3s ease;
    box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
  }

  #sidebar.open{
    right: 0;
  }

  #sidebar-close{
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: #DA70D6;
    font-size: 24px;
    cursor: pointer;
    padding: 5px;
    transition: color 0.2s;
  }

  #sidebar-close:hover{
    color: #00D9FF;
  }

  .sidebar-header{
    padding: 20px 20px 10px;
    border-bottom: 2px solid #DA70D6;
    margin-bottom: 20px;
  }

  .sidebar-header h2{
    color: #DA70D6;
    font-size: 18px;
    margin-bottom: 5px;
  }

  .sidebar-content{
    padding: 0 20px 20px 20px;
  }

  .info-section{
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #3a3a4a;
  }

  .info-section:last-child{
    border-bottom: none;
  }

  .info-label{
    font-size: 11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    font-weight: 700;
  }

  .info-value{
    font-size: 14px;
    color: #e0e0ff;
    margin-bottom: 10px;
    word-wrap: break-word;
  }

  .factory-number{
    display: inline-block;
    background: #DA70D6;
    color: #0a1628;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 12px;
    margin-right: 8px;
  }

  /* ============================================================
     MAP POPUP STYLES
     ============================================================ */
  .leaflet-popup-content-wrapper{
    border-radius: 4px;
    background: #1a1a2e;
    border: 2px solid #00d4ff;
  }
  .leaflet-popup-content-wrapper h4{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
    color: #00d4ff;
  }
  .leaflet-popup-content-wrapper p{
    font-size:13px;
    margin: 2px 0;
    color: #b0b0e0;
  }
  .leaflet-popup-content-wrapper .label{
    font-size:11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .factory-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 12px;
    font-weight: 700;
    color: #ffb347;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 -1px 3px rgba(0,0,0,0.9);
    z-index: 1000;
  }
  .factory-label::before{
    display:none;
  }

  .location-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 12px;
    font-weight: 700;
    color: #00ffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 -1px 3px rgba(0,0,0,0.9);
    z-index: 1000;
  }
  .location-label::before{
    display:none;
  }

  .city-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 11px;
    font-weight: 600;
    color: #b0b0e0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 -1px 2px rgba(0,0,0,0.9);
    z-index: 500;
  }
  .city-label::before{
    display:none;
  }

  .capital-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 10px;
    font-weight: 600;
    color: #d4af37;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 -1px 2px rgba(0,0,0,0.9);
    z-index: 600;
  }
  .capital-label::before{
    display:none;
  }

  .leaflet-attribution-flag, .leaflet-attribution { display:none; }

  /* Hide all OSM tile labels, regions, villages, etc. */
  .leaflet-tile-pane {
    filter: brightness(0.2) saturate(0.1) invert(1) hue-rotate(180deg) contrast(0.8);
  }

  /* Hide popup for tiles */
  .leaflet-popup { display: none; }
</style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <button id="sidebar-close">&times;</button>
  <div class="sidebar-header">
    <h2>Factory Details</h2>
  </div>
  <div class="sidebar-content" id="sidebar-content">
    <!-- Factory info will be inserted here -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   FACTORY DATA — Brown dots
   ============================================================ */
const factories = [
  { number: 1, name: "Factory 1", city: "Ho Chi Minh City", country: "Vietnam", lat: 10.8231, lng: 106.6297, director: "TBD", size: "TBD", products: [] },
  { number: 2, name: "Factory 2", city: "Qingdao", country: "China", lat: 36.0671, lng: 120.3826, director: "TBD", size: "TBD", products: [] },
  { number: 3, name: "Factory 3", city: "London", country: "United Kingdom", lat: 51.5072, lng: -0.1276, director: "TBD", size: "TBD", products: [] },
  { number: 4, name: "Factory 4", city: "Manchester", country: "United Kingdom", lat: 53.4808, lng: -2.2426, director: "TBD", size: "TBD", products: [] },
  { number: 5, name: "Factory 5", city: "Birmingham", country: "United Kingdom", lat: 52.4862, lng: -1.8904, director: "TBD", size: "TBD", products: [] },
  { number: 6, name: "Factory 6", city: "Glasgow", country: "United Kingdom", lat: 55.8642, lng: -4.2518, director: "TBD", size: "TBD", products: [] },
  { number: 7, name: "Factory 7", city: "Berryville", country: "USA (VA)", lat: 39.1496, lng: -77.9880, director: "TBD", size: "TBD", products: [] },
  { number: 8, name: "Factory 8", city: "Ahmedabad", country: "India", lat: 23.0225, lng: 72.5714, director: "TBD", size: "TBD", products: [] }
];

/* ============================================================
   LOCATION DATA — Blue dots
   ============================================================ */
const locations = [
  { name: "Dubai", country: "UAE", lat: 25.2048, lng: 55.2708 },
  { name: "Trelleborg", country: "Sweden", lat: 55.3675, lng: 13.1593 },
  { name: "Rotterdam", country: "Netherlands", lat: 51.9289, lng: 4.3957 },
  { name: "Melbourne", country: "Australia", lat: -37.8136, lng: 144.9631 },
  { name: "Houston", country: "Texas, USA", lat: 29.7604, lng: -95.3698 },
  { name: "Dordrecht", country: "Netherlands", lat: 51.8161, lng: 4.6695 },
  { name: "Singapore", country: "Singapore", lat: 1.3521, lng: 103.8198 }
];

/* ============================================================
   MAJOR CITIES — Grey dots
   ============================================================ */
const majorCities = [
  { name: "Tokyo", country: "Japan", lat: 35.6762, lng: 139.6503 },
  { name: "Delhi", country: "India", lat: 28.7041, lng: 77.1025 },
  { name: "Shanghai", country: "China", lat: 31.2304, lng: 121.4737 },
  { name: "São Paulo", country: "Brazil", lat: -23.5505, lng: -46.6333 },
  { name: "Mexico City", country: "Mexico", lat: 19.4326, lng: -99.1332 },
  { name: "Cairo", country: "Egypt", lat: 30.0444, lng: 31.2357 }
];

/* ============================================================
   COUNTRY CAPITALS — Small dots for capitals
   ============================================================ */
const capitals = [
  { name: "Beijing", country: "China", lat: 39.9042, lng: 116.4074 },
  { name: "Tokyo", country: "Japan", lat: 35.6762, lng: 139.6503 },
  { name: "New Delhi", country: "India", lat: 28.7041, lng: 77.1025 },
  { name: "Moscow", country: "Russia", lat: 55.7558, lng: 37.6173 },
  { name: "Paris", country: "France", lat: 48.8566, lng: 2.3522 },
  { name: "Berlin", country: "Germany", lat: 52.5200, lng: 13.4050 },
  { name: "Madrid", country: "Spain", lat: 40.4168, lng: -3.7038 },
  { name: "Rome", country: "Italy", lat: 41.9028, lng: 12.4964 },
  { name: "Washington DC", country: "USA", lat: 38.9072, lng: -77.0369 },
  { name: "Ottawa", country: "Canada", lat: 45.4215, lng: -75.6972 },
  { name: "Mexico City", country: "Mexico", lat: 19.4326, lng: -99.1332 },
  { name: "Brasília", country: "Brazil", lat: -15.7942, lng: -47.8822 },
  { name: "Cairo", country: "Egypt", lat: 30.0444, lng: 31.2357 },
  { name: "Canberra", country: "Australia", lat: -35.2809, lng: 149.1300 },
  { name: "Singapore", country: "Singapore", lat: 1.3521, lng: 103.8198 },
  { name: "Bangkok", country: "Thailand", lat: 13.7563, lng: 100.5018 },
  { name: "Hanoi", country: "Vietnam", lat: 21.0285, lng: 105.8542 }
];

/* ============================================================
   MAP SETUP — Dark Blue background with Dark Blue borders
   ============================================================ */
const map = L.map('map', {
  zoomControl: true,
  worldCopyJump: false,
  minZoom: 2,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0
}).setView([25, 40], 2);

/* ============================================================
   COMPLETELY MINIMAL BACKGROUND LAYER
   ============================================================ */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

/* ============================================================
   FETCH WORLD BORDERS GEOJSON & ADD DARK BLUE BORDERS
   ============================================================ */
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(response => response.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: '#1a3a4a',           /* Dark blue border */
        weight: 3,
        opacity: 1.0,
        fillColor: '#0a1628',       /* Dark blue fill */
        fillOpacity: 0.5
      },
      onEachFeature: function(feature, layer) {
        layer.unbindPopup();
      }
    }).addTo(map);
  })
  .catch(err => console.log('Error loading borders:', err));

/* ============================================================
   SIDEBAR FUNCTIONS
   ============================================================ */
function openSidebar(factory) {
  const sidebar = document.getElementById('sidebar');
  const sidebarContent = document.getElementById('sidebar-content');
  const mapDiv = document.getElementById('map');
  
  sidebarContent.innerHTML = `
    <div class="info-section">
      <div class="info-label">Factory Number</div>
      <div class="info-value">
        <span class="factory-number">F${factory.number}</span>
        ${factory.name}
      </div>
    </div>

    <div class="info-section">
      <div class="info-label">Location</div>
      <div class="info-value">${factory.city}</div>
      <div class="info-label">Country</div>
      <div class="info-value">${factory.country}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Coordinates</div>
      <div class="info-value">${factory.lat.toFixed(4)}, ${factory.lng.toFixed(4)}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Director</div>
      <div class="info-value">${factory.director || 'N/A'}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Size</div>
      <div class="info-value">${factory.size || 'N/A'}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Products</div>
      <div class="info-value">${factory.products.length ? factory.products.join(', ') : 'TBD'}</div>
    </div>
  `;
  
  sidebar.classList.add('open');
  mapDiv.classList.add('sidebar-open');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const mapDiv = document.getElementById('map');
  sidebar.classList.remove('open');
  mapDiv.classList.remove('sidebar-open');
}

document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

/* ============================================================
   FACTORY MARKER — Brown dots
   ============================================================ */
const factoryIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#8B5A3C;
    border:3px solid #ffb347;
    box-shadow:0 0 6px rgba(139,90,60,0.8), 0 0 12px rgba(0,0,0,0.6);
    cursor: pointer;
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   LOCATION MARKER — Blue dots
   ============================================================ */
const locationIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#00d4ff;
    border:3px solid #00ffff;
    box-shadow:0 0 6px rgba(0,212,255,0.8), 0 0 12px rgba(0,255,255,0.4);
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   MAJOR CITY MARKER — Grey dots
   ============================================================ */
const cityIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:10px;height:10px;border-radius:50%;
    background:#606080;
    border:2px solid #909090;
    box-shadow:0 0 4px rgba(90,90,110,0.6);
  "></div>`,
  iconSize: [10,10],
  iconAnchor: [5,5]
});

/* ============================================================
   CAPITAL MARKER — Small golden dots
   ============================================================ */
const capitalIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:8px;height:8px;border-radius:50%;
    background:#d4af37;
    border:1px solid #ffda44;
    box-shadow:0 0 3px rgba(212,175,55,0.6);
  "></div>`,
  iconSize: [8,8],
  iconAnchor: [4,4]
});

/* ============================================================
   ADD FACTORIES TO MAP
   ============================================================ */
factories.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: factoryIcon(), zIndexOffset: 1000 }).addTo(map);

  m.bindTooltip(f.city, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'factory-label'
  });

  m.on('click', () => {
    openSidebar(f);
  });

  m.bindPopup(`
    <div class="label">Factory ${f.number}</div>
    <h4>${f.city}, ${f.country}</h4>
    <p><strong>Director:</strong> ${f.director}</p>
    <p><strong>Size:</strong> ${f.size}</p>
    <p><strong>Products:</strong> ${f.products.length ? f.products.join(', ') : 'TBD'}</p>
  `);
});

/* ============================================================
   ADD LOCATIONS TO MAP
   ============================================================ */
locations.forEach(loc => {
  const m = L.marker([loc.lat, loc.lng], { icon: locationIcon(), zIndexOffset: 1000 }).addTo(map);

  m.bindTooltip(loc.name, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'location-label'
  });

  m.bindPopup(`
    <h4>${loc.name}</h4>
    <p><strong>Country/Region:</strong> ${loc.country}</p>
  `);
});

/* ============================================================
   ADD MAJOR CITIES TO MAP
   ============================================================ */
majorCities.forEach(city => {
  const m = L.marker([city.lat, city.lng], { icon: cityIcon(), zIndexOffset: 500 }).addTo(map);

  m.bindTooltip(city.name, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'city-label'
  });

  m.bindPopup(`
    <h4>${city.name}</h4>
    <p><strong>Country:</strong> ${city.country}</p>
  `);
});

/* ============================================================
   ADD COUNTRY CAPITALS TO MAP
   ============================================================ */
capitals.forEach(capital => {
  const m = L.marker([capital.lat, capital.lng], { icon: capitalIcon(), zIndexOffset: 600 }).addTo(map);

  m.bindTooltip(capital.name, {
    permanent: true,
    direction: 'top',
    offset: [0, -8],
    className: 'capital-label'
  });

  m.bindPopup(`
    <h4>${capital.name}</h4>
    <p><strong>Capital of:</strong> ${capital.country}</p>
  `);
});

/* ============================================================
   HANDLE WINDOW RESIZE FOR MAP
   ============================================================ */
window.addEventListener('resize', () => {
  setTimeout(() => {
    map.invalidateSize();
  }, 250);
});

</script>
</body>
</html>
