<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --steel: #1C1F22;
    --concrete: #F5F3EE;
    --amber: #D98E2B;
    --teal: #3E5C6B;
    --grey: #8A8F94;
    --line: #D9D4C8;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--concrete);
    color: var(--steel);
    overflow: hidden;
  }
  #map{ height:100vh; width:100vw; }

  .leaflet-popup-content-wrapper{
    border-radius: 4px;
  }
  .leaflet-popup-content-wrapper h4{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
  }
  .leaflet-popup-content-wrapper p{
    font-size:13px;
    margin: 2px 0;
    color: #444;
  }
  .leaflet-popup-content-wrapper .label{
    font-size:11px;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .factory-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--steel);
    text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 -1px 2px rgba(255,255,255,0.9);
  }
  .factory-label::before{
    display:none;
  }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   FACTORY DATA
   Edit lat/lng, director, products, size here as needed.
   ============================================================ */
const factories = [
  { number: 1, name: "Factory 1", city: "Ho Chi Minh City", country: "Vietnam", lat: 10.8231, lng: 106.6297, director: "TBD", size: "TBD", products: [] },
  { number: 2, name: "Factory 2", city: "Qingdao", country: "China", lat: 36.0671, lng: 120.3826, director: "TBD", size: "TBD", products: [] },
  { number: 3, name: "Factory 3", city: "London", country: "United Kingdom", lat: 51.5072, lng: -0.1276, director: "TBD", size: "TBD", products: [] },
  { number: 4, name: "Factory 4", city: "Manchester", country: "United Kingdom", lat: 53.4808, lng: -2.2426, director: "TBD", size: "TBD", products: [] },
  { number: 5, name: "Factory 5", city: "Birmingham", country: "United Kingdom", lat: 52.4862, lng: -1.8904, director: "TBD", size: "TBD", products: [] },
  { number: 6, name: "Factory 6", city: "Glasgow", country: "United Kingdom", lat: 55.8642, lng: -4.2518, director: "TBD", size: "TBD", products: [] },
  { number: 7, name: "Factory 7", city: "Berryville", country: "USA (VA)", lat: 39.1496, lng: -77.9880, director: "TBD", size: "TBD", products: [] },
  { number: 8, name: "Factory 8", city: "Ahmedabad", country: "India", lat: 23.0225, lng: 72.5714, director: "TBD", size: "TBD", products: [] }
];

/* ============================================================
   MAP SETUP — no API key needed, OpenStreetMap tiles are free
   ============================================================ */
const map = L.map('map', {
  zoomControl: true,
  worldCopyJump: false,
  minZoom: 2,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0
}).setView([25, 40], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

const dotIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:12px;height:12px;border-radius:50%;
    background:${'#D98E2B'};
    border:2px solid white;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);
  "></div>`,
  iconSize: [12,12],
  iconAnchor: [6,6]
});

factories.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: dotIcon() }).addTo(map);

  m.bindTooltip(f.city, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'factory-label'
  });

  m.bindPopup(`
    <div class="label">Factory ${f.number}</div>
    <h4>${f.city}, ${f.country}</h4>
    <p><strong>Director:</strong> ${f.director}</p>
    <p><strong>Size:</strong> ${f.size}</p>
    <p><strong>Products:</strong> ${f.products.length ? f.products.join(', ') : 'TBD'}</p>
  `);
});
</script>
</body>
</html>
