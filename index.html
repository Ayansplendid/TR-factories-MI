<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --dark-blue: #0a1628;
    --light-green: #c5e5c5;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--light-green);
    color: #1a1a2e;
    overflow: hidden;
  }
  #map{ 
    height:100vh; 
    width:100vw; 
    transition: width 0.3s ease; 
  }
  #map.sidebar-open{ 
    width: calc(100vw - 350px); 
  }

  /* ============================================================
     SIDEBAR STYLES
     ============================================================ */
  #sidebar{
    position: fixed;
    right: -350px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: linear-gradient(135deg, #0a1628 0%, #1a0f3d 100%);
    border-left: 3px solid #DA70D6;
    color: #e0e0ff;
    overflow-y: auto;
    z-index: 2000;
    transition: right 0.3s ease;
    box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
  }

  #sidebar.open{
    right: 0;
  }

  #sidebar-close{
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: #DA70D6;
    font-size: 24px;
    cursor: pointer;
    padding: 5px;
    transition: color 0.2s;
  }

  #sidebar-close:hover{
    color: #00D9FF;
  }

  .sidebar-header{
    padding: 20px 20px 10px;
    border-bottom: 2px solid #DA70D6;
    margin-bottom: 20px;
  }

  .sidebar-header h2{
    color: #DA70D6;
    font-size: 18px;
    margin-bottom: 5px;
  }

  .sidebar-content{
    padding: 0 20px 20px 20px;
  }

  .info-section{
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #3a3a4a;
  }

  .info-section:last-child{
    border-bottom: none;
  }

  .info-label{
    font-size: 11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    font-weight: 700;
  }

  .info-value{
    font-size: 14px;
    color: #e0e0ff;
    margin-bottom: 10px;
    word-wrap: break-word;
  }

  .factory-number{
    display: inline-block;
    background: #DA70D6;
    color: #0a1628;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 12px;
    margin-right: 8px;
  }

  /* ============================================================
     MAP POPUP STYLES
     ============================================================ */
  .leaflet-popup-content-wrapper{
    border-radius: 4px;
    background: #1a1a2e;
    border: 3px solid #DA70D6;
    box-shadow: 0 0 20px rgba(218, 112, 214, 0.5);
  }

  .leaflet-popup-content-wrapper h4{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
    color: #DA70D6;
  }

  .leaflet-popup-content-wrapper p{
    font-size:13px;
    margin: 5px 0;
    color: #b0b0e0;
  }

  .leaflet-popup-close-button{
    color: #DA70D6;
    font-size: 20px;
    font-weight: bold;
  }

  /* ============================================================
     TOOLTIP STYLES
     ============================================================ */
  .factory-city-label{
    background: rgba(139, 90, 60, 0.95);
    border: 2px solid #ffb347;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  .factory-city-label::before{
    display:none;
  }

  .location-label{
    background: rgba(0, 102, 204, 0.95);
    border: 2px solid #0099ff;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  .location-label::before{
    display:none;
  }

  .country-label{
    background: rgba(26, 58, 74, 0.95);
    border: 2px solid #DA70D6;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #DA70D6;
    text-shadow: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
  }

  .country-label::before{
    display:none;
  }

  /* ============================================================
     HOVER TOOLTIP
     ============================================================ */
  .hover-tooltip{
    background: #1a1a2e !important;
    border: 2px solid #DA70D6 !important;
    border-radius: 4px !important;
    padding: 8px 10px !important;
    color: #e0e0ff !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    box-shadow: 0 2px 10px rgba(218, 112, 214, 0.6) !important;
    max-width: 280px !important;
  }

  .hover-tooltip strong{
    color: #DA70D6;
  }

  .leaflet-attribution-flag, .leaflet-attribution { display:none; }

  /* Custom map tiles filter */
  .light-map-tiles {
    filter: brightness(1.2) saturate(0.4) hue-rotate(80deg);
    opacity: 0.15 !important;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <button id="sidebar-close">&times;</button>
  <div class="sidebar-header">
    <h2 id="sidebar-title">Details</h2>
  </div>
  <div class="sidebar-content" id="sidebar-content">
    <!-- Info will be inserted here -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>

<script>
/* ============================================================
   MAP SETUP
   ============================================================ */
const map = L.map('map', {
  zoomControl: true,
  worldCopyJump: false,
  minZoom: 2,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0
}).setView([25, 40], 2);

/* ============================================================
   VERY TRANSPARENT BACKGROUND LAYER
   ============================================================ */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '',
  maxZoom: 19,
  noWrap: true,
  className: 'light-map-tiles',
  opacity: 0.15
}).addTo(map);

/* ============================================================
   COUNTRY BORDERS WITH HOVER
   ============================================================ */
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(response => response.json())
  .then(data => {
    L.geoJSON(data, {
      style: function(feature) {
        return {
          color: '#1a4d6d',
          weight: 2,
          opacity: 0.9,
          fillColor: '#7eb37e',
          fillOpacity: 0.25
        };
      },
      onEachFeature: function(feature, layer) {
        const countryName = feature.properties.ADMIN || 'Unknown';
        
        layer.on('mouseover', function() {
          this.setStyle({
            color: '#DA70D6',
            weight: 4,
            opacity: 1.0,
            fillColor: '#9dd99d',
            fillOpacity: 0.4
          });
          this.bringToFront();
          
          this.bindTooltip(countryName, {
            permanent: false,
            direction: 'center',
            className: 'country-label',
            offset: [0, 0]
          }).openTooltip();
        });
        
        layer.on('mouseout', function() {
          this.setStyle({
            color: '#1a4d6d',
            weight: 2,
            opacity: 0.9,
            fillColor: '#7eb37e',
            fillOpacity: 0.25
          });
          this.closeTooltip();
        });
      }
    }).addTo(map);
  })
  .catch(err => console.log('Error loading borders:', err));

/* ============================================================
   SIDEBAR FUNCTIONS
   ============================================================ */
function openFactorySidebar(factory) {
  const sidebar = document.getElementById('sidebar');
  const sidebarContent = document.getElementById('sidebar-content');
  const sidebarTitle = document.getElementById('sidebar-title');
  const mapDiv = document.getElementById('map');
  
  sidebarTitle.textContent = 'Factory Details';
  
  sidebarContent.innerHTML = `
    <div class="info-section">
      <div class="info-label">Factory Number</div>
      <div class="info-value">
        <span class="factory-number">F${factory.number}</span>
        ${factory.name}
      </div>
    </div>

    <div class="info-section">
      <div class="info-label">Location</div>
      <div class="info-value">${factory.city}</div>
      <div class="info-label">Country</div>
      <div class="info-value">${factory.country}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Coordinates</div>
      <div class="info-value">${factory.lat.toFixed(4)}, ${factory.lng.toFixed(4)}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Director</div>
      <div class="info-value">${factory.director}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Staff Count</div>
      <div class="info-value">${factory.staff} employees</div>
    </div>

    <div class="info-section">
      <div class="info-label">Main Products</div>
      <div class="info-value">${factory.products.join(', ')}</div>
    </div>
  `;
  
  sidebar.classList.add('open');
  mapDiv.classList.add('sidebar-open');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const mapDiv = document.getElementById('map');
  sidebar.classList.remove('open');
  mapDiv.classList.remove('sidebar-open');
}

document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

/* ============================================================
   FACTORY ICON
   ============================================================ */
const factoryIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#8B5A3C;
    border:3px solid #ffb347;
    box-shadow:0 0 6px rgba(139,90,60,0.8), 0 0 12px rgba(0,0,0,0.6);
    cursor: pointer;
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   LOCATION ICON
   ============================================================ */
const locationIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#0066cc;
    border:3px solid #0099ff;
    box-shadow:0 0 6px rgba(0,102,204,0.8), 0 0 12px rgba(0,0,0,0.6);
    cursor: pointer;
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   ADD FACTORIES TO MAP
   ============================================================ */
factories.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: factoryIcon(), zIndexOffset: 1000 }).addTo(map);

  /* Always visible city name label */
  m.bindTooltip(f.city, {
    permanent: true,
    direction: 'right',
    offset: [12, 0],
    className: 'factory-city-label'
  });

  /* Hover tooltip - show factory info */
  const hoverContent = `<strong>${f.name}</strong><br/>Director: ${f.director}<br/>Staff: ${f.staff} employees<br/>Products: ${f.products.join(', ')}`;\n  
  m.on('mouseover', function() {
    this.bindTooltip(hoverContent, {
      permanent: false,
      direction: 'top',
      offset: [0, -15],
      className: 'hover-tooltip',
      opacity: 1
    }).openTooltip();
  });

  m.on('mouseout', function() {
    this.closeTooltip();
  });

  /* Also hover over city name */
  const tooltipElement = m.getTooltip();
  if (tooltipElement) {
    L.DomEvent.on(tooltipElement, 'mouseover', function() {
      m.bindTooltip(hoverContent, {
        permanent: false,
        direction: 'top',
        offset: [0, -15],
        className: 'hover-tooltip',
        opacity: 1
      }).openTooltip();
    });

    L.DomEvent.on(tooltipElement, 'mouseout', function() {
      m.closeTooltip();
    });
  }

  /* Click on dot or city name to open sidebar */
  m.on('click', () => {
    openFactorySidebar(f);
  });

  m.bindPopup(`
    <div style="font-size:11px;color:#7a7aff;text-transform:uppercase;letter-spacing:0.03em;">Factory ${f.number}</div>
    <h4 style="font-size:15px;font-weight:700;margin:4px 0;color:#DA70D6;">${f.city}, ${f.country}</h4>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Director:</strong> ${f.director}</p>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Staff:</strong> ${f.staff} employees</p>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Products:</strong> ${f.products.join(', ')}</p>
  `, {
    maxWidth: 300
  });
});

/* ============================================================
   ADD LOCATIONS TO MAP
   ============================================================ */
locations.forEach(loc => {
  const m = L.marker([loc.lat, loc.lng], { icon: locationIcon(), zIndexOffset: 1000 }).addTo(map);

  /* Always visible location name label */
  m.bindTooltip(loc.name, {
    permanent: true,
    direction: 'right',
    offset: [12, 0],
    className: 'location-label'
  });

  /* Hover tooltip - show code + category */
  const hoverContent = `<strong>${loc.code}</strong><br/>${loc.category}`;\n  
  m.on('mouseover', function() {
    this.bindTooltip(hoverContent, {
      permanent: false,
      direction: 'top',
      offset: [0, -15],
      className: 'hover-tooltip',
      opacity: 1
    }).openTooltip();
  });

  m.on('mouseout', function() {
    this.closeTooltip();
  });

  m.bindPopup(`
    <h4 style="font-size:15px;font-weight:700;margin:4px 0;color:#DA70D6;">${loc.name}</h4>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Code:</strong> ${loc.code}</p>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Category:</strong> ${loc.category}</p>
    <p style="font-size:13px;margin:5px 0;color:#b0b0e0;"><strong>Country/Region:</strong> ${loc.country}</p>
  `, {
    maxWidth: 300
  });
});

/* ============================================================
   HANDLE WINDOW RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  setTimeout(() => {
    map.invalidateSize();
  }, 250);
});
</script>

</body>
</html>
