<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --steel: #1C1F22;
    --concrete: #F5F3EE;
    --amber: #D98E2B;
    --teal: #3E5C6B;
    --grey: #8A8F94;
    --line: #D9D4C8;
    --dark-blue: #0a1628;
    --violet: #1a0f3d;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--dark-blue);
    color: #e0e0ff;
    overflow: hidden;
  }
  #map{ height:100vh; width:100vw; }

  .leaflet-popup-content-wrapper{
    border-radius: 4px;
    background: #1a1a2e;
    border: 2px solid #00d4ff;
  }
  .leaflet-popup-content-wrapper h4{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
    color: #00d4ff;
  }
  .leaflet-popup-content-wrapper p{
    font-size:13px;
    margin: 2px 0;
    color: #b0b0e0;
  }
  .leaflet-popup-content-wrapper .label{
    font-size:11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .factory-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 13px;
    font-weight: 600;
    color: #ffb347;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 -1px 3px rgba(0,0,0,0.8);
  }
  .factory-label::before{
    display:none;
  }

  .location-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 13px;
    font-weight: 600;
    color: #00d4ff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 -1px 3px rgba(0,0,0,0.8);
  }
  .location-label::before{
    display:none;
  }

  .leaflet-attribution-flag, .leaflet-attribution { display:none; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   FACTORY DATA — Brown dots
   ============================================================ */
const factories = [
  { number: 1, name: "Factory 1", city: "Ho Chi Minh City", country: "Vietnam", lat: 10.8231, lng: 106.6297, director: "TBD", size: "TBD", products: [] },
  { number: 2, name: "Factory 2", city: "Qingdao", country: "China", lat: 36.0671, lng: 120.3826, director: "TBD", size: "TBD", products: [] },
  { number: 3, name: "Factory 3", city: "London", country: "United Kingdom", lat: 51.5072, lng: -0.1276, director: "TBD", size: "TBD", products: [] },
  { number: 4, name: "Factory 4", city: "Manchester", country: "United Kingdom", lat: 53.4808, lng: -2.2426, director: "TBD", size: "TBD", products: [] },
  { number: 5, name: "Factory 5", city: "Birmingham", country: "United Kingdom", lat: 52.4862, lng: -1.8904, director: "TBD", size: "TBD", products: [] },
  { number: 6, name: "Factory 6", city: "Glasgow", country: "United Kingdom", lat: 55.8642, lng: -4.2518, director: "TBD", size: "TBD", products: [] },
  { number: 7, name: "Factory 7", city: "Berryville", country: "USA (VA)", lat: 39.1496, lng: -77.9880, director: "TBD", size: "TBD", products: [] },
  { number: 8, name: "Factory 8", city: "Ahmedabad", country: "India", lat: 23.0225, lng: 72.5714, director: "TBD", size: "TBD", products: [] }
];

/* ============================================================
   LOCATION DATA — Blue dots
   ============================================================ */
const locations = [
  { name: "Dubai", country: "UAE", lat: 25.2048, lng: 55.2708 },
  { name: "Trelleborg", country: "Sweden", lat: 55.3675, lng: 13.1593 },
  { name: "Rotterdam", country: "Netherlands", lat: 51.9289, lng: 4.3957 },
  { name: "Melbourne", country: "Australia", lat: -37.8136, lng: 144.9631 },
  { name: "Houston", country: "Texas, USA", lat: 29.7604, lng: -95.3698 },
  { name: "Dordrecht", country: "Netherlands", lat: 51.8161, lng: 4.6695 },
  { name: "Singapore", country: "Singapore", lat: 1.3521, lng: 103.8198 }
];

/* ============================================================
   MAP SETUP — Dark Blue/Violet with simplified cartography
   ============================================================ */
const map = L.map('map', {
  zoomControl: true,
  worldCopyJump: false,
  minZoom: 2,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0
}).setView([25, 40], 2);

/* ============================================================
   DARK BLUE/VIOLET TILE LAYER with high contrast borders
   ============================================================ */
L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_tonerBackground/{z}/{x}/{y}.png', {
  attribution: '',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_tonerlabels/{z}/{x}/{y}.png', {
  attribution: '',
  maxZoom: 19,
  noWrap: true
}).addTo(map);

/* Add dark overlay for violet effect */
const overlayStyle = document.createElement('style');
overlayStyle.innerHTML = `
  .leaflet-tile-pane {
    filter: invert(0.9) hue-rotate(200deg) brightness(0.6) contrast(1.2);
  }
  .leaflet-overlay-pane svg {
    filter: invert(0.9) hue-rotate(200deg) brightness(0.6);
  }
`;
document.head.appendChild(overlayStyle);

/* ============================================================
   FACTORY MARKER — Brown dots
   ============================================================ */
const factoryIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#8B5A3C;
    border:3px solid #ffb347;
    box-shadow:0 0 6px rgba(139,90,60,0.8), 0 0 12px rgba(0,0,0,0.6);
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   LOCATION MARKER — Blue dots
   ============================================================ */
const locationIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#00d4ff;
    border:3px solid #00ffff;
    box-shadow:0 0 6px rgba(0,212,255,0.8), 0 0 12px rgba(0,255,255,0.4);
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   ADD FACTORIES TO MAP
   ============================================================ */
factories.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: factoryIcon() }).addTo(map);

  m.bindTooltip(f.city, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'factory-label'
  });

  m.bindPopup(`
    <div class="label">Factory ${f.number}</div>
    <h4>${f.city}, ${f.country}</h4>
    <p><strong>Director:</strong> ${f.director}</p>
    <p><strong>Size:</strong> ${f.size}</p>
    <p><strong>Products:</strong> ${f.products.length ? f.products.join(', ') : 'TBD'}</p>
  `);
});

/* ============================================================
   ADD LOCATIONS TO MAP
   ============================================================ */
locations.forEach(loc => {
  const m = L.marker([loc.lat, loc.lng], { icon: locationIcon() }).addTo(map);

  m.bindTooltip(loc.name, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'location-label'
  });

  m.bindPopup(`
    <h4>${loc.name}</h4>
    <p><strong>Country/Region:</strong> ${loc.country}</p>
  `);
});

</script>
</body>
</html>
