<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --steel: #1C1F22;
    --concrete: #F5F3EE;
    --amber: #D98E2B;
    --teal: #3E5C6B;
    --grey: #8A8F94;
    --line: #D9D4C8;
    --dark-blue: #0a1628;
    --violet: #1a0f3d;
    --neon-blue: #00D9FF;
    --light-green: #c5e5c5;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--light-green);
    color: #1a1a2e;
    overflow: hidden;
  }
  #map{ height:100vh; width:100vw; transition: width 0.3s ease; }
  #map.sidebar-open{ width: calc(100vw - 350px); }

  /* ============================================================
     SIDEBAR STYLES
     ============================================================ */
  #sidebar{
    position: fixed;
    right: -350px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: linear-gradient(135deg, #0a1628 0%, #1a0f3d 100%);
    border-left: 3px solid #DA70D6;
    color: #e0e0ff;
    overflow-y: auto;
    z-index: 2000;
    transition: right 0.3s ease;
    box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
  }

  #sidebar.open{
    right: 0;
  }

  #sidebar-close{
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: #DA70D6;
    font-size: 24px;
    cursor: pointer;
    padding: 5px;
    transition: color 0.2s;
  }

  #sidebar-close:hover{
    color: #00D9FF;
  }

  .sidebar-header{
    padding: 20px 20px 10px;
    border-bottom: 2px solid #DA70D6;
    margin-bottom: 20px;
  }

  .sidebar-header h2{
    color: #DA70D6;
    font-size: 18px;
    margin-bottom: 5px;
  }

  .sidebar-content{
    padding: 0 20px 20px 20px;
  }

  .info-section{
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #3a3a4a;
  }

  .info-section:last-child{
    border-bottom: none;
  }

  .info-label{
    font-size: 11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    font-weight: 700;
  }

  .info-value{
    font-size: 14px;
    color: #e0e0ff;
    margin-bottom: 10px;
    word-wrap: break-word;
  }

  .factory-number{
    display: inline-block;
    background: #DA70D6;
    color: #0a1628;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 12px;
    margin-right: 8px;
  }

  /* ============================================================
     MAP POPUP STYLES
     ============================================================ */
  .leaflet-popup-content-wrapper{
    border-radius: 4px;
    background: #1a1a2e;
    border: 3px solid #DA70D6;
    box-shadow: 0 0 20px rgba(218, 112, 214, 0.5);
  }
  .leaflet-popup-content-wrapper h4{
    font-size:15px;
    font-weight:700;
    margin-bottom:4px;
    color: #DA70D6;
  }
  .leaflet-popup-content-wrapper p{
    font-size:13px;
    margin: 5px 0;
    color: #b0b0e0;
  }
  .leaflet-popup-content-wrapper .label{
    font-size:11px;
    color: #7a7aff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .leaflet-popup-close-button{
    color: #DA70D6;
    font-size: 20px;
    font-weight: bold;
  }

  .factory-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 12px;
    font-weight: 700;
    color: #8B5A3C;
    text-shadow: 0 1px 3px rgba(255,255,255,0.8), 0 -1px 3px rgba(255,255,255,0.8);
    z-index: 1000;
  }
  .factory-label::before{
    display:none;
  }

  .location-label{
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 12px;
    font-weight: 700;
    color: #0066cc;
    text-shadow: 0 1px 3px rgba(255,255,255,0.8), 0 -1px 3px rgba(255,255,255,0.8);
    z-index: 1000;
    cursor: pointer;
  }
  .location-label::before{
    display:none;
  }

  .capital-label{
    display: none;
  }

  .leaflet-attribution-flag, .leaflet-attribution { display:none; }
</style>
</head>
<body>

<div id="map"></div>

<div id="sidebar">
  <button id="sidebar-close">&times;</button>
  <div class="sidebar-header">
    <h2 id="sidebar-title">Details</h2>
  </div>
  <div class="sidebar-content" id="sidebar-content">
    <!-- Info will be inserted here -->
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   FACTORY DATA
   ============================================================ */
const factories = [
  { number: 1, name: "Factory 1", city: "Ho Chi Minh City", country: "Vietnam", lat: 10.8231, lng: 106.6297, director: "Nguyen Van A", staff: 850, products: ["Electronics", "Components"] },
  { number: 2, name: "Factory 2", city: "Qingdao", country: "China", lat: 36.0671, lng: 120.3826, director: "Li Wei", staff: 1200, products: ["Textiles", "Fabrics"], code: "TMEQ", category: "Marine Infra Products" },
  { number: 3, name: "Factory 3", city: "London", country: "United Kingdom", lat: 51.5072, lng: -0.1276, director: "James Smith", staff: 450, products: ["Machinery", "Parts"] },
  { number: 4, name: "Factory 4", city: "Manchester", country: "United Kingdom", lat: 53.4808, lng: -2.2426, director: "Michael Brown", staff: 680, products: ["Chemicals", "Compounds"] },
  { number: 5, name: "Factory 5", city: "Birmingham", country: "United Kingdom", lat: 52.4862, lng: -1.8904, director: "Sarah Johnson", staff: 520, products: ["Metal Works", "Castings"] },
  { number: 6, name: "Factory 6", city: "Glasgow", country: "United Kingdom", lat: 55.8642, lng: -4.2518, director: "Robert Wilson", staff: 390, products: ["Electronics", "Circuits"] },
  { number: 7, name: "Factory 7", city: "Berryville", country: "USA (VA)", lat: 39.1496, lng: -77.9880, director: "David Miller", staff: 560, products: ["Plastics", "Polymers"] },
  { number: 8, name: "Factory 8", city: "Ahmedabad", country: "India", lat: 23.0225, lng: 72.5714, director: "Rajesh Patel", staff: 920, products: ["Pharmaceuticals", "Medicines"] }
];

/* ============================================================
   LOCATION DATA — Blue dots with product info
   ============================================================ */
const locations = [
  { name: "Dubai", country: "UAE", lat: 25.2048, lng: 55.2708, code: "TMEDX", category: "Hub & Distribution" },
  { name: "Trelleborg", country: "Sweden", lat: 55.3675, lng: 13.1593, code: "TMETR", category: "Port & Logistics" },
  { name: "Rotterdam", country: "Netherlands", lat: 51.9289, lng: 4.3957, code: "TMEROT", category: "Port & Logistics" },
  { name: "Melbourne", country: "Australia", lat: -37.8136, lng: 144.9631, code: "TMEMB", category: "Pacific Hub" },
  { name: "Houston", country: "Texas, USA", lat: 29.7604, lng: -95.3698, code: "TMEHS", category: "North America Hub" },
  { name: "Dordrecht", country: "Netherlands", lat: 51.8161, lng: 4.6695, code: "TMEDDR", category: "Port & Logistics" },
  { name: "Singapore", country: "Singapore", lat: 1.3521, lng: 103.8198, code: "TMESG", category: "Asia Pacific Hub" }
];

/* ============================================================
   MAP SETUP — Light green background, more transparent
   ============================================================ */
const map = L.map('map', {
  zoomControl: true,
  worldCopyJump: false,
  minZoom: 2,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 1.0
}).setView([25, 40], 2);

/* ============================================================
   TRANSPARENT LIGHT GREEN BACKGROUND LAYER
   ============================================================ */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '',
  maxZoom: 19,
  noWrap: true,
  className: 'light-map-tiles',
  opacity: 0.3
}).addTo(map);

/* Apply light green filter to tiles */
const style = document.createElement('style');
style.innerHTML = `
  .light-map-tiles {
    filter: brightness(1.5) saturate(0.5) hue-rotate(80deg);
    opacity: 0.3 !important;
  }
`;
document.head.appendChild(style);

/* Store GeoJSON layer for hover effects */
let geoJSONLayer;

/* ============================================================
   FETCH WORLD BORDERS GEOJSON & ADD DARK BLUE BORDERS
   ============================================================ */
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
  .then(response => response.json())
  .then(data => {
    geoJSONLayer = L.geoJSON(data, {
      style: {
        color: '#1a3a4a',           /* Dark blue border */
        weight: 2,
        opacity: 0.8,
        fillColor: '#c5e5c5',       /* Light green fill */
        fillOpacity: 0.15
      },
      onEachFeature: function(feature, layer) {
        layer.unbindPopup();
        
        /* Add hover effect */
        layer.on('mouseover', function() {
          this.setStyle({
            color: '#0a1628',
            weight: 4,
            opacity: 1.0,
            fillOpacity: 0.25
          });
          this.bringToFront();
        });
        
        layer.on('mouseout', function() {
          this.setStyle({
            color: '#1a3a4a',
            weight: 2,
            opacity: 0.8,
            fillOpacity: 0.15
          });
        });
      }
    }).addTo(map);
  })
  .catch(err => console.log('Error loading borders:', err));

/* ============================================================
   SIDEBAR FUNCTIONS
   ============================================================ */
function openFactorySidebar(factory) {
  const sidebar = document.getElementById('sidebar');
  const sidebarContent = document.getElementById('sidebar-content');
  const sidebarTitle = document.getElementById('sidebar-title');
  const mapDiv = document.getElementById('map');
  
  sidebarTitle.textContent = 'Factory Details';
  
  sidebarContent.innerHTML = `
    <div class="info-section">
      <div class="info-label">Factory Number</div>
      <div class="info-value">
        <span class="factory-number">F${factory.number}</span>
        ${factory.name}
      </div>
    </div>

    <div class="info-section">
      <div class="info-label">Location</div>
      <div class="info-value">${factory.city}</div>
      <div class="info-label">Country</div>
      <div class="info-value">${factory.country}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Coordinates</div>
      <div class="info-value">${factory.lat.toFixed(4)}, ${factory.lng.toFixed(4)}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Director</div>
      <div class="info-value">${factory.director}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Staff Count</div>
      <div class="info-value">${factory.staff} employees</div>
    </div>

    <div class="info-section">
      <div class="info-label">Main Products</div>
      <div class="info-value">${factory.products.join(', ')}</div>
    </div>
  `;
  
  sidebar.classList.add('open');
  mapDiv.classList.add('sidebar-open');
}

function openLocationSidebar(location) {
  const sidebar = document.getElementById('sidebar');
  const sidebarContent = document.getElementById('sidebar-content');
  const sidebarTitle = document.getElementById('sidebar-title');
  const mapDiv = document.getElementById('map');
  
  sidebarTitle.textContent = 'Location Details';
  
  sidebarContent.innerHTML = `
    <div class="info-section">
      <div class="info-label">Location Name</div>
      <div class="info-value">
        <span class="factory-number">${location.code}</span>
        ${location.name}
      </div>
    </div>

    <div class="info-section">
      <div class="info-label">Country/Region</div>
      <div class="info-value">${location.country}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Coordinates</div>
      <div class="info-value">${location.lat.toFixed(4)}, ${location.lng.toFixed(4)}</div>
    </div>

    <div class="info-section">
      <div class="info-label">Category</div>
      <div class="info-value">${location.category}</div>
    </div>
  `;
  
  sidebar.classList.add('open');
  mapDiv.classList.add('sidebar-open');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const mapDiv = document.getElementById('map');
  sidebar.classList.remove('open');
  mapDiv.classList.remove('sidebar-open');
}

document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

/* ============================================================
   FACTORY MARKER — Brown dots
   ============================================================ */
const factoryIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#8B5A3C;
    border:3px solid #ffb347;
    box-shadow:0 0 6px rgba(139,90,60,0.8), 0 0 12px rgba(0,0,0,0.6);
    cursor: pointer;
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   LOCATION MARKER — Blue dots
   ============================================================ */
const locationIcon = () => L.divIcon({
  className: '',
  html: `<div style="
    width:14px;height:14px;border-radius:50%;
    background:#0066cc;
    border:3px solid #0099ff;
    box-shadow:0 0 6px rgba(0,102,204,0.8), 0 0 12px rgba(0,0,0,0.6);
    cursor: pointer;
  "></div>`,
  iconSize: [14,14],
  iconAnchor: [7,7]
});

/* ============================================================
   ADD FACTORIES TO MAP
   ============================================================ */
factories.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: factoryIcon(), zIndexOffset: 1000 }).addTo(map);

  m.bindTooltip(f.city, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'factory-label'
  });

  m.on('click', () => {
    openFactorySidebar(f);
    m.openPopup();
  });

  m.bindPopup(`
    <div class="label">Factory ${f.number}</div>
    <h4>${f.city}, ${f.country}</h4>
    <p><strong>Director:</strong> ${f.director}</p>
    <p><strong>Staff:</strong> ${f.staff} employees</p>
    <p><strong>Products:</strong> ${f.products.join(', ')}</p>
  `, {
    maxWidth: 300,
    className: 'factory-popup'
  });
});

/* ============================================================
   ADD LOCATIONS TO MAP WITH HOVER TOOLTIPS
   ============================================================ */
locations.forEach(loc => {
  const m = L.marker([loc.lat, loc.lng], { icon: locationIcon(), zIndexOffset: 1000 }).addTo(map);

  /* Hover tooltip showing code and category */
  m.bindTooltip(`<strong>${loc.code}</strong> - ${loc.category}`, {
    permanent: false,
    direction: 'top',
    offset: [0, -15],
    className: 'location-hover-tooltip',
    opacity: 0.95
  });

  /* Permanent label with location name */
  m.bindTooltip(loc.name, {
    permanent: true,
    direction: 'right',
    offset: [8, 0],
    className: 'location-label'
  });

  /* Click to open sidebar */
  m.on('click', () => {
    openLocationSidebar(loc);
  });

  m.bindPopup(`
    <h4>${loc.name}</h4>
    <p><strong>Code:</strong> ${loc.code}</p>
    <p><strong>Category:</strong> ${loc.category}</p>
    <p><strong>Country/Region:</strong> ${loc.country}</p>
  `, {
    maxWidth: 300
  });
});

/* ============================================================
   HANDLE WINDOW RESIZE FOR MAP
   ============================================================ */
window.addEventListener('resize', () => {
  setTimeout(() => {
    map.invalidateSize();
  }, 250);
});

</script>
</head>
<body>

</body>
</html>
